[project]
name = "instagram-mcp"
version = "0.1.0"
description = "Local, read-only MCP server that gives your AI assistant your Instagram Insights: performance, trends, audience, posts, reels, stories and comments."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nelson Rogers" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "instagram", "instagram-insights", "instagram-api", "analytics", "creator"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "tzdata>=2024.1; sys_platform == 'win32'",
  "pillow>=10.4",
]

[project.scripts]
instagram-mcp = "instagram_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/nelsonrogers/instagram-mcp"
Documentation = "https://github.com/nelsonrogers/instagram-mcp#readme"
Issues = "https://github.com/nelsonrogers/instagram-mcp/issues"
Changelog = "https://github.com/nelsonrogers/instagram-mcp/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "scripts", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "SIM", "RUF", "C4", "PTH", "N", "S", "T20"]
ignore = [
  "S101", # assert is fine in tests
  "RUF001", # allow typographic characters in strings
  "RUF002",
  "E501", # the formatter owns line length; long string literals are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH", "T20"]
"scripts/**" = ["T20"]
"src/instagram_mcp/{cli,selfcheck}.py" = ["T20"] # these talk to a human on a terminal

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]
